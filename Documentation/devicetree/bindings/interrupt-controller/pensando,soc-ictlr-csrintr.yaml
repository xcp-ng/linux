%YAML 1.2
---
$id: http://devicetree.org/schemas/interrupt-controller/pensando,soc-ictlr-csrintr.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: AMD Pensando SoC CSR interrupt controller

maintainers:
  - Brad Larson <blarson@amd.com>

properties:
  compatible:
    const: pensando,soc-ictlr-csrintr

  reg:
    maxItems: 1

  interrupts:
    minItems: 1
    maxItems: 32

  interrupt-controller: true

  '#interrupt-cells':
    const: 2

required:
  - compatible
  - interrupt-controller
  - '#interrupt-cells'

additionalProperties: true

examples:
  - |
    interrupt-controller {
        compatible = "pensando,soc-ictlr-csrintr";
        interrupt-controller;
        #interrupt-cells = <2>;
    };

...
