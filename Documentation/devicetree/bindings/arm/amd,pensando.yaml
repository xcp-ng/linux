%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/amd,pensando.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: AMD Pensando SoC Platforms

maintainers:
  - Brad Larson <bradley.larson@amd.com>

description:
  Device trees for AMD Pensando Elba, Giglio, and Salina platform variants.

properties:
  $nodename:
    const: "/"

  compatible:
    oneOf:
      - description: Boards with AMD Pensando Elba SoC
        items:
          - enum:
              - amd,pensando-elba-ortano
          - const: amd,pensando-elba

      - description: Boards with AMD Pensando Giglio SoC
        items:
          - const: amd,pensando-giglio

      - description: Boards with Pensando Giglio SoC
        items:
          - const: pensando,giglio

      - description: Boards with Pensando Salina SoC
        items:
          - const: pensando,salina

      - description: Boards with Pensando Salina A35 SoC
        items:
          - const: pensando,salina-a35

additionalProperties: true

...
