%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/pensando/pensando,platform-interrupt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: AMD Pensando platform interrupt helper devices

maintainers:
  - Brad Larson <blarson@amd.com>

description:
  Small platform devices used to route or handle Pensando SoC-specific
  interrupts.

properties:
  compatible:
    enum:
      - pensando,salina-cmn-pmu-interrupt
      - pensando,giglio-emmc-interrupt

  interrupts:
    maxItems: 1

  reg:
    minItems: 1
    maxItems: 2

required:
  - compatible

additionalProperties: true

examples:
  - |
    interrupt-helper {
        compatible = "pensando,salina-cmn-pmu-interrupt";
        interrupts = <53>;
    };

...
