%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/pensando/pensando,penfw.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: AMD Pensando firmware interface

maintainers:
  - Brad Larson <blarson@amd.com>

properties:
  compatible:
    const: pensando,penfw

  method:
    description: Firmware call method.
    enum:
      - smc
      - hvc

required:
  - compatible

additionalProperties: true

examples:
  - |
    firmware {
        penfw {
            compatible = "pensando,penfw";
            method = "smc";
        };
    };

...
