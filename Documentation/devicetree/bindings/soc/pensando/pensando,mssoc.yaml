%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/pensando/pensando,mssoc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: AMD Pensando miscellaneous SoC syscon block

maintainers:
  - Brad Larson <blarson@amd.com>

properties:
  compatible:
    items:
      - const: pensando,mssoc
      - const: syscon

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    syscon@61000000 {
        compatible = "pensando,mssoc", "syscon";
        reg = <0x61000000 0x80000>;
    };

...
