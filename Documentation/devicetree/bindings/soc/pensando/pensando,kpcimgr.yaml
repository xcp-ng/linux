%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/pensando/pensando,kpcimgr.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: AMD Pensando kernel PCI manager

maintainers:
  - Brad Larson <blarson@amd.com>

properties:
  compatible:
    const: pensando,kpcimgr

  reg:
    minItems: 1
    maxItems: 8

  interrupts:
    minItems: 1
    maxItems: 32

required:
  - compatible

additionalProperties: true

examples:
  - |
    kpcimgr {
        compatible = "pensando,kpcimgr";
    };

...
