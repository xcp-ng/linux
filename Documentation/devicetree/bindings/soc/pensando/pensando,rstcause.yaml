%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/pensando/pensando,rstcause.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: AMD Pensando reset cause registers

maintainers:
  - Brad Larson <blarson@amd.com>

properties:
  compatible:
    const: pensando,rstcause

  pensando,causeregs:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description: Syscon phandle and offset for reset cause registers.

required:
  - compatible
  - pensando,causeregs

additionalProperties: false

examples:
  - |
    rstcause {
        compatible = "pensando,rstcause";
        pensando,causeregs = <&mssoc 0x204>;
    };

...
