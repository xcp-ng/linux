%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/pensando/pensando,pcie.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: AMD Pensando PCIe platform control block

maintainers:
  - Brad Larson <blarson@amd.com>

properties:
  compatible:
    const: pensando,pcie

  reg:
    minItems: 1
    maxItems: 8

required:
  - compatible

additionalProperties: true

examples:
  - |
    pcie {
        compatible = "pensando,pcie";
        reg = <0x0 0x1000>;
    };

...
