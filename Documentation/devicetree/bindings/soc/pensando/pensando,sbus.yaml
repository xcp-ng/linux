%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/pensando/pensando,sbus.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: AMD Pensando serial bus controller

maintainers:
  - Brad Larson <blarson@amd.com>

properties:
  compatible:
    const: pensando,sbus

  reg:
    minItems: 1
    maxItems: 4

required:
  - compatible

additionalProperties: true

examples:
  - |
    sbus@0 {
        compatible = "pensando,sbus";
        reg = <0x0 0x1000>;
    };

...
