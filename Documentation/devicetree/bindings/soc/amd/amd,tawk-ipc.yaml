%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/amd/amd,tawk-ipc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: AMD Pensando TAWK IPC memory region

maintainers:
  - Brad Larson <blarson@amd.com>

description:
  Shared memory and mailbox register description for the AMD Pensando TAWK
  IPC interface.

properties:
  compatible:
    const: amd,tawk-ipc

  reg:
    minItems: 1
    maxItems: 8

  rst-sigs:
    $ref: /schemas/types.yaml#/definitions/uint32-array

  nmboxes:
    $ref: /schemas/types.yaml#/definitions/uint32

  mbox-ctl:
    $ref: /schemas/types.yaml#/definitions/uint32-array

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    ipc@0 {
        compatible = "amd,tawk-ipc";
        reg = <0x0 0x0>;
        rst-sigs = <0x4 0x0>;
        nmboxes = <2>;
        mbox-ctl = <0x0 0x3>;
    };

...
